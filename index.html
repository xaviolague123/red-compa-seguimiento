<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Red Compa · Ubicación en vivo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--bg:#EEF0EC;--surface:#fff;--fg:#1B1F1C;--muted:#4F5751;--line:#B9C0B7;--accent:#A84A08;--sos:#B81E17;--sos-soft:#F8D9D6;--ok:#1A6B3C;--ok-soft:#D5EDDF}
  @media (prefers-color-scheme: dark){:root{--bg:#121513;--surface:#1B1F1C;--fg:#ECEFEA;--muted:#AAB2AC;--line:#56605A;--accent:#F08A3C;--sos:#E8463C;--sos-soft:#3B1715;--ok:#5CC48A;--ok-soft:#163223}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 32px;display:grid;gap:12px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:.04em}
  .brand i{width:9px;height:24px;background:var(--accent);border-radius:2px;display:block}
  .status{border-radius:14px;padding:14px;border:2px solid var(--sos);background:var(--sos-soft)}
  .status.ok{border-color:var(--ok);background:var(--ok-soft)}
  .status h1{margin:0 0 4px;font-size:22px}
  #map{height:52vh;min-height:280px;border-radius:14px;border:1px solid var(--line)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  a.btn{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:700;text-decoration:none;border:2px solid var(--line);color:var(--fg);background:var(--surface)}
  a.btn.sos{background:var(--sos);border-color:var(--sos);color:#fff}
  .muted{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i></i>RED COMPA</div>
  <div id="status" class="status"><h1>Cargando…</h1><div id="sub" class="muted"></div></div>
  <div id="map"></div>
  <div class="card" id="info"></div>
  <div class="row">
    <a class="btn sos" href="tel:911">Llamar al 911</a>
    <a class="btn" id="gmaps" href="#" target="_blank" rel="noopener">Abrir en Google Maps</a>
  </div>
  <p class="muted">Si no te contesta, no insistas con llamadas: puede estar en peligro. Llama al 911 y diles la placa y la ubicación. Esta página se actualiza sola cada 10 segundos y deja de mostrar la ubicación cuando la alerta termina.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const SUPABASE_URL = 'https://sjjyxunelurvponqrjgp.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_SBRaohpjs7MU223NwP9osg_NznkciOv';
  const token = new URLSearchParams(location.search).get('t');
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const map = L.map('map').setView([32.51, -117.0], 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
  let marker = null, first = true;
  const $ = (id) => document.getElementById(id);
  const ago = (iso) => { const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); return s < 60 ? `hace ${s} s` : s < 3600 ? `hace ${Math.round(s / 60)} min` : `hace ${Math.round(s / 3600)} h`; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function load() {
    if (!token) { $('status').className = 'status ok'; $('status').querySelector('h1').textContent = 'Enlace incompleto'; $('sub').textContent = 'Abre el enlace completo que te llegó por SMS o WhatsApp.'; return; }
    const { data, error } = await sb.rpc('get_share', { p_token: token });
    if (error || !data || !data.ok) {
      $('status').className = 'status ok';
      $('status').querySelector('h1').textContent = 'Este enlace ya no está activo';
      $('sub').textContent = 'Los enlaces duran 24 horas como máximo.';
      return;
    }
    const st = $('status');
    st.className = data.open ? 'status' : 'status ok';
    st.querySelector('h1').textContent = data.open ? `${data.name} compartió su ubicación` : `${data.name}: la alerta terminó`;
    $('sub').textContent = data.updated_at ? `Última ubicación ${ago(data.updated_at)}` : (data.open ? 'Todavía sin ubicación' : '');
    $('info').innerHTML = `<b>Taxi unidad ${esc(data.unit)}</b><br>${esc(data.car)} · Placa <b>${esc(data.plate)}</b><br><span class="muted">Desde las ${new Date(data.started_at).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false })}</span>`;
    if (data.lat != null && data.open) {
      const ll = [data.lat, data.lng];
      if (!marker) marker = L.circleMarker(ll, { radius: 11, color: '#fff', weight: 3, fillColor: '#B81E17', fillOpacity: 1 }).addTo(map);
      else marker.setLatLng(ll);
      if (first) { map.setView(ll, 16); first = false; }
      $('gmaps').href = `https://www.google.com/maps/search/?api=1&query=${data.lat},${data.lng}`;
    } else if (!data.open && marker) { map.removeLayer(marker); marker = null; }
  }
  load(); setInterval(load, 10000);
</script>
</body>
</html>
